#####################################################################
# ZAŁĄCZENIA PLIKÓW I USTAWIENIA GŁÓWNE
#####################################################################

[include speedtest.cfg]
[include fluidd.cfg]
[include macro.cfg]
[include eddy.cfg]
[include KAMP_Settings.cfg]
#[include adxl.cfg]
#[include moonraker_obico_macros.cfg]

[exclude_object]
[force_move]
enable_force_move: True

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_440033001251313531383332-if00

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100


#####################################################################
# SILNIKI OŚ X / Y (Sensorless Homing & TMC2209)
#####################################################################

[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_x:virtual_endstop
homing_speed: 40
homing_retract_dist: 5
position_endstop: 0
position_max: 235

[tmc2209 stepper_x]
uart_pin: PC4
diag_pin: ^PG6
run_current: 1.100
stealthchop_threshold: 0
driver_SGTHRS: 76
driver_tbl: 1
driver_toff: 2
driver_hstrt: 4
driver_hend: 1

[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 32
endstop_pin: tmc2209_stepper_y:virtual_endstop
homing_speed: 40
homing_retract_dist: 0
position_endstop: -45
position_min: -45
position_max: 235

[tmc2209 stepper_y]
uart_pin: PD11
diag_pin: ^PG9
run_current: 1.100
stealthchop_threshold: 0
driver_SGTHRS: 110
driver_tbl: 1
driver_toff: 2
driver_hstrt: 4
driver_hend: 1


#####################################################################
# SILNIKI OŚ Z (Dual Z)
#####################################################################

[stepper_z]
step_pin: PF11
dir_pin: !PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -7
position_max: 225

[tmc2209 stepper_z]
uart_pin: PC6
run_current: 0.600
stealthchop_threshold: 0
driver_tbl: 1
driver_toff: 3
driver_hstrt: 0
driver_hend: 2

[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
microsteps: 16
rotation_distance: 8

[tmc2209 stepper_z1]
uart_pin: PC7
run_current: 0.600
stealthchop_threshold: 0
driver_tbl: 1
driver_toff: 3
driver_hstrt: 0
driver_hend: 2


#####################################################################
# KALIBRACJA POZIOMOWANIA STOŁU
#####################################################################

[screws_tilt_adjust]
screw1: 32, 30
screw1_name: lewy przod
screw2: 202, 30
screw2_name: prawy przod
screw3: 202, 180
screw3_name: prawy tyl
screw4: 32, 180
screw4_name: lewy tyl
horizontal_move_z: 10
speed: 100
screw_thread: CW-M3

[z_tilt]
z_positions:
    -10, 117.5
    245, 117.5
points:
    30, 117.5
    205, 117.5
speed: 100
horizontal_move_z: 5
retries: 3
retry_tolerance: 0.02


#####################################################################
# EKSTRUDER & GRZAŁKI
#####################################################################

[extruder]
step_pin: PE2
dir_pin: !PE3
enable_pin: !PD4
microsteps: 16
rotation_distance: 22.6789
gear_ratio: 50:17
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA3
sensor_pin: PF4
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 280
max_extrude_only_distance: 101.0
max_extrude_cross_section: 5.0

[tmc2209 extruder]
uart_pin: PE1
uart_address: 0
run_current: 0.800
hold_current: 0.300
stealthchop_threshold: 0
driver_tbl: 1
driver_toff: 2
driver_hstrt: 4
driver_hend: 1

[heater_bed]
heater_pin: PA0
sensor_pin: PF3
sensor_type: EPCOS 100K B57560G104F
min_temp: 0
max_temp: 130


#####################################################################
# WENTYLATORY & CZUJNIKI TEMPERATURY
#####################################################################

[fan]
pin: PA8

[heater_fan hotend_fan]
pin: PE5
max_power: 1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

[controller_fan fan_1]
pin: PD12
max_power: 0.5
kick_start_time: 0.200
stepper: stepper_x, stepper_y, stepper_z, extruder

[controller_fan fan_2]
pin: PD13
max_power: 0.5
kick_start_time: 0.200
stepper: stepper_x, stepper_y, stepper_z, extruder

[controller_fan fan_3]
pin: PD14
max_power: 0.5
kick_start_time: 0.200
stepper: stepper_x, stepper_y, stepper_z, extruder

[controller_fan fan_4]
pin: PD15
max_power: 0.5
kick_start_time: 0.200
stepper: stepper_x, stepper_y, stepper_z, extruder

[temperature_sensor Raspberry_Pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor Octopus_Board]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100


#####################################################################
# INPUT SHAPER (ADXL)
#####################################################################

[input_shaper]
shaper_type_x = ei
shaper_freq_x = 101.2
damping_ratio_x = 0.082
shaper_type_y = mzv
shaper_freq_y = 62.0
damping_ratio_y = 0.093


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2
# menu_timeout: 40

[output_pin beeper]
pin: EXP1_1


