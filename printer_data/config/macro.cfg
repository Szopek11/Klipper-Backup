
#====================================================================
# 1. KONFIGURACJA SYSTEMOWA (SDCARD, STATUS, PAUZA)
#====================================================================
[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

#====================================================================
# 2. CENTRALNY PANEL STEROWANIA (ZMIENNE KLIENTA)
#====================================================================
[gcode_macro _CLIENT_VARIABLE]
### --- POZYCJE PARKOWANIA ---
# Maksymalny bezpieczny prawy tył stołu (odjazd na koniec druku)
variable_park_x          : 0.0   ; Bezpieczny X w granicach max 235
variable_park_y          : 0.0   ; Bezpieczny Y w granicach max 210
variable_park_z_max      : 210.0   ; Wysokość na jaką ma odjechać Z po zakończeniu (max 260)
variable_custom_park_dz  : 5.0     ; O ile mm podnieść głowicę przy pauzie

### --- FILAMENT I ZMIANA (M600) ---
variable_m600_x          : 220.0   ; Pozycja X zmiany filamentu
variable_m600_y          : 0.0     ; Pozycja Y zmiany filamentu na krawędzi stołu
variable_retract         : 1.0     ; Retrakcja przy PAUSE
variable_cancel_retract  : 5.0     ; Retrakcja przy CANCEL
variable_m600_retract    : 50.0    ; Długość wycofania filamentu przy M600 (zmiana)

### --- PRĘDKOŚCI ---
variable_speed_hop       : 15.0    ; Prędkość Z (mm/s)
variable_speed_move      : 100.0   ; Prędkość jałowa (mm/s)
variable_speed_retract   : 35.0    ; Prędkość retrakcji (mm/s)

### --- INNE ---
variable_park_at_cancel  : True    ; Czy parkować przy anulowaniu?
variable_user_pause_macro: ""      ; Pozostawione puste, aby uniknąć pętli
gcode:

#====================================================================
# 3. GŁÓWNE MAKRA OPERACYJNE (CANCEL, RESUME, PAUSE, M600)
#====================================================================
[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
description: Anulowanie druku z użyciem centralnych ustawień
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  CANCEL_PRINT_BASE
  M400
  G91
  G1 Z10 E-{client.cancel_retract} F600
  G90
  G1 X{client.park_x} Y{client.park_y} Z{client.park_z_max} F{client.speed_move * 60}
  M104 S0
  M140 S0
  M107
  M84
  CLEAR_PAUSE

[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
  RESUME_BASE VELOCITY={client.speed_move}

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    _TOOLHEAD_PARK_PAUSE_CANCEL
    RESPOND MSG="Druk wstrzymany"

[gcode_macro M600]
description: Zmiana filamentu
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
    PAUSE
    G90
    G0 X{client.m600_x} Y{client.m600_y} F6000
    G91
    G1 E-{client.m600_retract} F1800
    G90
    RESPOND MSG="ZMIANA FILAMENTU: Wymień drut i kliknij RESUME"

#====================================================================
# 4. OBSŁUGA WARSTW (SET_PAUSE_AT_LAYER / NEXT_LAYER)
#====================================================================
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
  {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE|int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call}
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call}
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}

#====================================================================
# 5. CZYSZCZENIE DYSZY I PARKOWANIE POMOCNICZE
#====================================================================
[gcode_macro CLEAN_NOZZLE]
variable_start_x: 171
variable_start_y: -20
variable_start_z: 0
variable_wipe_dist: 34
variable_wipe_qty: 10
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %} G28 {% endif %}
    G90
    G1 Z5 F3000                 
    G1 X{start_x} Y{start_y} F6000
    G1 Z{start_z} F1500
    
    {% for wipes in range(wipe_qty) %}
        G1 X{start_x + wipe_dist} F12000
        G1 X{start_x} F12000
    {% endfor %}
    
    G1 Z10 F3000


    
[gcode_macro CLEAN_NOZZLE_PARK]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
    G90
    G1 X{client.park_x} Y-20 Z10 F6000
    
[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
gcode:
    {% set client = printer['gcode_macro _CLIENT_VARIABLE'] %}
    {% set z_max = printer.toolhead.axis_maximum.z %}
    {% set z_act = printer.toolhead.position.z %}
    {% set z_safe = [z_act + client.custom_park_dz, z_max]|min %}
    
    G90
    G1 Z{z_safe} F600
    G1 X{client.park_x} Y{client.park_y} F{client.speed_move * 60}

#====================================================================
# 6. START/KONIEC DRUKU
#====================================================================

[gcode_macro PRINT_START]
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
    {% set PREHEAT_TEMP = 150 %}

    G90
    M83

    G28


    # Start grzania
    M140 S{BED_TEMP}
    M104 S{PREHEAT_TEMP}

    CLEAN_NOZZLE_PARK

    # Czekaj na stół i temperaturę wstępną
    M190 S{BED_TEMP}
    M109 S{PREHEAT_TEMP}
    
  
    
    
    # Mesh

    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1
    CLEAN_NOZZLE_PARK
    
    # Dogrzanie do finalnej temperatury
    M104 S{EXTRUDER_TEMP}
    M109 S{EXTRUDER_TEMP}

    
    LINE_PURGE

    G92 E0

[gcode_macro END_PRINT]
description: Makro kończące druk
gcode:
    M400
    G91      
    G1 E-1 F600
    G1 Z10 F600
    G90
    G1 Z240 F6000     ; Odjazd Z w bezpieczne miejsce (max 260)
    G1 X220 Y200 F5000 ; Odjazd w prawy tył
    G1 E1 F600
    M104 S0
    M140 S0
    M107
    G92 E0
    M84


#====================================================================
# 8. FILAMENT (UNLOAD, CHANGE)
#====================================================================
[gcode_macro UNLOAD_FILAMENT]
description: Bezpieczne i szybkie wyładowanie filamentu (Rapido UHF + HGX Lite)
gcode:
    SAVE_GCODE_STATE NAME=unloading_filament
    M117 Wyładowywanie...
    
    # 1. Upewnij się, że dysza jest gorąca (zabezpieczenie przed cold-pull)
    {% if printer.extruder.temperature < 200 %}
        {action_respond_info("Dysza za zimna! Grzanie do 220C...")}
        M109 S220
    {% endif %}

    G91             # Pozycjonowanie relatywne
    G92 E0          # Zeruj ekstruder
    
    # 2. RAMMING: Szybkie wypchnięcie i natychmiastowe uderzenie wsteczne.
    # To formuje idealną końcówkę filamentu bez nitki.
    G1 E5 F600      ; Lekkie dopchnięcie
    G1 E-12 F3600   ; Bardzo szybkie szarpnięcie wsteczne, wyciąga plastik ze strefy UHF
    
    # 3. Chłodzenie końcówki (krótka pauza, żeby plastik w rurce lekko stężał)
    G4 P500         ; Czekaj 0.5 sekundy
    
    # 4. Wyciągnięcie reszty nitki z ekstrudera HGX Lite
    G1 E-90 F1500   ; Płynny odjazd do pełnego wyjęcia (HGX ma duże przełożenie, więc F1500 to bezpieczny max)
    
    G92 E0
    RESTORE_GCODE_STATE NAME=unloading_filament
    M117 Filament wyładowany
    STATUS_READY    # Jeśli używasz makr Stealthburnera dla LED

[gcode_macro LOAD_FILAMENT]
description: Szybkie ładowanie filamentu przez Stealthburner do Rapido UHF
gcode:
    SAVE_GCODE_STATE NAME=loading_filament
    M117 Ładowanie...
    
    # 1. Upewnij się, że dysza jest gorąca
    {% if printer.extruder.temperature < 200 %}
        {action_respond_info("Dysza za zimna! Grzanie do 220C...")}
        M109 S220
    {% endif %}

    G91
    G92 E0
    
    # 2. Szybki wsuw (Bowden/Stealthburner body)
    # W Stealthburnerze z HGX Lite od kół zębatych do wejścia w Rapido UHF jest kawałek drogi.
    # 85-90mm to bezpieczna wartość, żeby dojechać do samej strefy topnienia.
    G1 E85 F1200    ; Szybki wjazd przez ekstruder do gardzieli
    
    # 3. Roztopienie i powolne przetłaczanie przez strefę meltzone UHF
    G1 E40 F300     ; Przejście przez długi blok Rapido UHF
    
    # 4. Purge (Czyszczenie i zmiana koloru)
    G1 E25 F150     ; Wolny wycisk końcowy, żeby ładnie oczyścić dyszę
    
    G92 E0
    RESTORE_GCODE_STATE NAME=loading_filament
    M117 Filament gotowy
    STATUS_READY
