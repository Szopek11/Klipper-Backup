[mcu cartographer]
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_64004200125030514B343620-if00


[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 2.10 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output
lift_speed: 30
[safe_z_home]
home_xy_position: 100, 100  # Środek stołu dla bazowania Z
z_hop: 5                # Podniesienie głowicy przed bazowaniem
z_hop_speed: 50               # Prędkość podnoszenia osi Z
speed: 200        

[bed_mesh]
zero_reference_position: 100, 100
speed: 300
horizontal_move_z: 2
mesh_min: 10, -1
mesh_max: 180, 160
probe_count: 20, 20
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA3 # For Cartographer V3
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
probe_points:
    117.5, 117.5, 20